# push 到 main 就自动构建并部署到 Cloudflare Workers（静态站走 Workers Static Assets）。
#
# 需要两个仓库 Secret：
#   CLOUDFLARE_API_TOKEN   权限 Workers Scripts:Edit
#   CLOUDFLARE_ACCOUNT_ID  账号 ID

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    # 注意：站点正文本身就是 src/content/docs 下的 md，绝不能整体忽略 md，
    # 否则改内容不会触发部署。这里只忽略仓库说明文件。
    paths-ignore:
      - "README.md"
  workflow_dispatch: {}

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 构建
        run: npm run build
      - name: 部署
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
